<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shared Worlds</title>
  <desc id="desc">One Terraria world, any friend can host. Per-account friends-only Steam Workshop snapshots for tModLoader.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#0b2235"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ad4e8"/>
      <stop offset="1" stop-color="#2c8aa5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#2c8aa5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2c8aa5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e4b61" stroke-opacity="0.3" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="250" cy="40" rx="460" ry="300" fill="url(#glow)"/>

  <g opacity="0.9">
    <circle cx="936" cy="102" r="34" fill="#0d2233" stroke="#2c8aa5" stroke-width="2"/>
    <circle cx="1020" cy="176" r="34" fill="#0d2233" stroke="#2c8aa5" stroke-width="2"/>
    <circle cx="914" cy="236" r="34" fill="#0d2233" stroke="#2c8aa5" stroke-width="2"/>
    <path d="M 960 120 L 996 158" stroke="#6ad4e8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 996 194 L 950 224" stroke="#6ad4e8" stroke-width="3" stroke-linecap="round"/>
    <text x="936" y="109" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#dceef7">A</text>
    <text x="1020" y="183" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#dceef7">B</text>
    <text x="914" y="243" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#dceef7">C</text>
    <text x="1054" y="98" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#93b3c4">own item</text>
    <text x="1054" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#93b3c4">own item</text>
    <text x="948" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#93b3c4">own item</text>
  </g>

  <g>
    <text x="64" y="122" font-family="Segoe UI, system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#e8f8ff">Shared Worlds</text>
    <text x="66" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="500" fill="#b8d5e2">One Terraria world. Any friend can host.</text>
    <text x="66" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#93b3c4">Per-account friends-only Steam Workshop snapshots · version graph · fork detection</text>
    <rect x="66" y="244" width="154" height="34" rx="17" fill="#102c3f" stroke="#1e4b61"/>
    <text x="143" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#6ad4e8">tModLoader 1.4.4</text>
    <rect x="232" y="244" width="142" height="34" rx="17" fill="#102c3f" stroke="#1e4b61"/>
    <text x="303" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f2b84b">MIT licensed</text>
    <rect x="386" y="244" width="104" height="34" rx="17" fill="#102c3f" stroke="#1e4b61"/>
    <text x="438" y="266" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#6ad4e8">v0.2.0</text>
  </g>

  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)" opacity="0.9"/>
</svg>
