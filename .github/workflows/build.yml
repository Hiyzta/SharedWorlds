name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download tModLoader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tml
          curl -sSL -o tml.zip \
            "https://github.com/tModLoader/tModLoader/releases/download/v2026.09.3.1/tModLoader.zip"
          unzip -q tml.zip -d .tml

      - name: Configure local tModLoader path
        shell: bash
        run: |
          set -euo pipefail
          cat > src/SharedWorlds/Local.props <<EOF
          <Project>
            <PropertyGroup>
              <tMLSteamPath>${GITHUB_WORKSPACE}/.tml/</tMLSteamPath>
            </PropertyGroup>
          </Project>
          EOF

      - name: Prepare tModLoader native libraries
        shell: bash
        run: |
          set -euo pipefail
          cd .tml/Libraries/Native/Linux
          ln -sf libFNA3D.so.0 FNA3D.so
          ln -sf libFNA3D.so.0 libFNA3D.so
          ln -sf libFAudio.so.0 FAudio.so
          ln -sf libFAudio.so.0 libFAudio.so
          ln -sf libSDL2-2.0.so.0 libSDL2.so
          echo "LD_LIBRARY_PATH=${GITHUB_WORKSPACE}/.tml/Libraries/Native/Linux:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Restore and build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/SharedWorlds/SharedWorlds.csproj -c Release \
            -p:ExtraBuildModFlags="-tmlsavedirectory ${GITHUB_WORKSPACE}/artifacts"

      - name: Run logic tests
        run: dotnet run --project tests/SharedWorlds.Tests/SharedWorlds.Tests.csproj -c Release

      - name: Collect .tmod
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/Mods
          ls -la
          cp SharedWorlds.tmod "${GITHUB_WORKSPACE}/SharedWorlds-${GITHUB_SHA}.tmod"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharedWorlds-tmod
          path: SharedWorlds-*.tmod

      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SharedWorlds-*.tmod
          generate_release_notes: true
          fail_on_unmatched_files: true
